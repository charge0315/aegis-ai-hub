frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/**/*'
          - 'src/App.tsx'
          - 'src/App.css'
          - 'src/index.css'
          - 'public/**/*'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/api/**/*'
          - 'electron/**/*'

logic:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/agents/**/*'
          - 'src/core/**/*'
          - 'src/services/**/*'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**/*'
          - 'playwright.config.ts'
          - 'vitest.config.ts'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**/*'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'
